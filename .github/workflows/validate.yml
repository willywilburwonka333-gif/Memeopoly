name: Memeopoly checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Validate manifest and app references
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('game.js', 'utf8');
          const ids = [...js.matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(match => match[1]);
          const missing = [...new Set(ids)].filter(id => !new RegExp('id=["\\x27]' + id + '["\\x27]').test(html));
          if (missing.length) {
            console.error('Missing HTML elements:', missing.join(', '));
            process.exit(1);
          }
          for (const file of ['style.css', 'game.js', 'manifest.webmanifest', 'sw.js', 'icon.svg']) {
            if (!fs.existsSync(file)) throw new Error('Missing app asset: ' + file);
          }
          console.log('Manifest, DOM references and app assets verified.');
          NODE